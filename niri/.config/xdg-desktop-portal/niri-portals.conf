[preferred]
# niri: xdg-desktop-portal-gtk for everything else (file chooser, etc.) and
# xdg-desktop-portal-gnome for screencast/screenshots (required by niri).
# Install the backend with: sudo dnf install xdg-desktop-portal-gnome
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
