general {
    # Lock command: single direct invocation of the Quickshell lockscreen.
    # hypridle also runs this when it receives the logind "Lock" signal
    # (e.g. from `loginctl lock-session`).
    lock_cmd = ~/.config/quickshell/scripts/session-lock.sh

    # Lock the session before the system suspends. `setsid -f` detaches the
    # locker so this command returns immediately and does not block suspend.
    before_sleep_cmd = setsid -f ~/.config/quickshell/scripts/session-lock.sh

    # niri ADAPTATION: `hyprctl dispatch dpms on` does not exist.
    # niri turns the screens back on automatically on any input, so
    # after_sleep_cmd is intentionally omitted.
}
# 1. Lock the screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = ~/.config/quickshell/scripts/session-lock.sh
}
# 2. Turn off the screen (DPMS) after 6 minutes
#    niri ADAPTATION: hyprctl dispatch dpms off -> niri msg action power-off-monitors
listener {
    timeout = 360
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
# 3. Suspend the laptop after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

# Launched with: hypridle -c ~/.config/niri/hypridle.conf
# (see TaianNiriM/autostart.kdl)
